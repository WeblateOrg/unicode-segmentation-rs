name: Security audit

on:
  pull_request:
  push:
    branches:
    - main
    paths:
    - Cargo.lock
    - Cargo.toml
    - .github/workflows/security-audit.yml
  schedule:
  - cron: 37 4 * * 1
  workflow_dispatch:

permissions:
  contents: read

env:
  # renovate: datasource=crate depName=cargo-audit
  CARGO_AUDIT_VERSION: 0.22.2

jobs:
  rustsec:
    name: RustSec audit
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Install cargo-audit
      uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
      with:
        fallback: none
        tool: cargo-audit@${{ env.CARGO_AUDIT_VERSION }}
    - name: Audit Rust dependencies
      run: cargo audit --file Cargo.lock
